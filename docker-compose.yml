services:
  postgres:
    image: postgres:16-alpine
    container_name: entitymatcher-postgres
    environment:
      POSTGRES_DB: entity_matcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    # Docker defaults a container's /dev/shm to 64MB. PostgreSQL allocates parallel
    # worker state there, so on this database -- which holds a 191k-row result set the
    # UI pages, filters and searches -- both parallel query execution and maintenance
    # hit that ceiling. VACUUM (ANALYZE) over match_results failed three times with
    # "could not resize shared memory segment ... No space left on device" while the
    # host had 2.9TB free, and only completed with PARALLEL 0. The error names disk,
    # which is why this is worth a comment rather than a bare value.
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: entitymatcher-backend
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/entity_matcher?sslmode=disable
      # JWT_SECRET MUST be overridden outside of dev
      JWT_SECRET: dev-secret-change-me-in-production
      # Confines server-side `file_path` values the connector endpoints may open
      # (backlog M1). Unset denies every one of them, which is the safe default but
      # also leaves Test Connection, Introspect Schema and "Load Data & Start Batch"
      # with no reachable success path at all -- backlog T1 could not exercise them
      # for exactly this reason. Point it at a directory that is mounted read-only
      # below, so the blast radius is that directory and nothing else.
      CONNECTOR_FILE_ROOT: /data/connector
    volumes:
      # Read-only on purpose: these endpoints only ever read.
      - ./connector-data:/data/connector:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: entitymatcher-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
