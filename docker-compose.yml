services:
  postgres:
    image: postgres:16-alpine
    container_name: entitymatcher-postgres
    environment:
      POSTGRES_DB: entity_matcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: entitymatcher-backend
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/entity_matcher?sslmode=disable
      # JWT_SECRET MUST be overridden outside of dev
      JWT_SECRET: dev-secret-change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: entitymatcher-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
