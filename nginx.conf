server {
    listen 80;
    server_name _;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1024;

    # Serve the SPA from /usr/share/nginx/html with history mode fallback
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # The SPA entry point must never be cached. Asset filenames are content-hashed,
    # so a stale index.html pins the browser to the previous build's bundle -- a deploy
    # then appears to have no effect until the cache expires.
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Static assets - longer cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8085;

        # Match the backend's MaxUploadBytes (50 MiB). nginx defaults to 1m,
        # which rejects real spreadsheets with a 413 HTML page before the
        # request ever reaches Go.
        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and caching for all API endpoints
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # Longer read timeout for SSE and long-running operations
        proxy_read_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
